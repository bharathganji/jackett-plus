name: Bug Report
description: File a bug report to help us improve Jackett Plus
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you are running the latest version of Jackett Plus.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Start stack with `docker compose up -d`
        2. Perform search query `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: vpn-provider
    attributes:
      label: VPN Provider / Setup
      options:
        - VPNBook (OpenVPN UDP 25000)
        - Private Custom .ovpn Provider
        - WireGuard / Gluetun
        - None / Running without VPN
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Container Logs
      description: Output from `docker compose logs --tail=50`. (Sanitize any private credentials before submitting!)
      render: shell
