name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # 1. Gitleaks Secret Scanning Gate
  # --------------------------------------------------------------------------
  secret-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # --------------------------------------------------------------------------
  # 2. Backend Validation (Python 3.12 + Pytest)
  # --------------------------------------------------------------------------
  backend-test:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt

      - name: Install Dependencies
        run: |
          cd services/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pytest-asyncio anyio respx

      - name: Run Unit Tests
        env:
          JACKETT_API_URL: http://localhost:9117
          API_KEY: ci_test_key
          PORT: 9889
        run: |
          cd services/api
          PYTHONPATH=. pytest

  # --------------------------------------------------------------------------
  # 3. Frontend Validation (Node.js 22 + React 19 Build)
  # --------------------------------------------------------------------------
  frontend-test:
    name: Frontend UI Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/ui/package-lock.json

      - name: Install Dependencies
        run: |
          cd services/ui
          npm ci

      - name: Verify TypeScript & Build
        run: |
          cd services/ui
          npm run build

  # --------------------------------------------------------------------------
  # 4. Docker Compose Orchestration Validation
  # --------------------------------------------------------------------------
  compose-lint:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Compose Specification
        env:
          VPN_AUTH: "vpnbook.com;vpnbook;dummy"
          JACKETT_API_KEY: "dummy_key"
        run: |
          cp .env.example .env
          touch vpn/vpn.conf
          docker compose config --quiet
